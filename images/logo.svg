<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#FFB6C1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 圆角背景 -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bgGrad)"/>
  <!-- 装饰小圆点 -->
  <circle cx="40" cy="44" r="6" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="216" cy="48" r="8" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="210" cy="210" r="5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="36" cy="212" r="7" fill="#FFFFFF" opacity="0.4"/>
  <!-- 日历卡片 -->
  <rect x="58" y="72" width="140" height="120" rx="20" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <!-- 日历顶部红色横条 -->
  <rect x="58" y="72" width="140" height="36" rx="20" fill="#FF6B9D"/>
  <rect x="58" y="92" width="140" height="16" fill="#FF6B9D"/>
  <!-- 日历挂钉 -->
  <rect x="84" y="62" width="8" height="24" rx="4" fill="#FF4D6D"/>
  <rect x="164" y="62" width="8" height="24" rx="4" fill="#FF4D6D"/>
  <!-- 日历内容：假期图标行 -->
  <circle cx="88" cy="128" r="10" fill="#FFE8F0"/>
  <circle cx="128" cy="128" r="10" fill="#E8F0FF"/>
  <circle cx="168" cy="128" r="10" fill="#FFF4E8"/>
  <!-- 日历文字 -->
  <text x="128" y="172" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="bold" fill="#FF6B9D">假期</text>
  <!-- 兔子耳朵装饰（右上角） -->
  <ellipse cx="196" cy="60" rx="14" ry="28" fill="#FFFFFF" opacity="0.9" transform="rotate(20 196 60)"/>
  <ellipse cx="194" cy="62" rx="6" ry="18" fill="#FFB6C1" opacity="0.8" transform="rotate(20 194 62)"/>
</svg>
