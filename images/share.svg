<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="50%" stop-color="#FF8FB1"/>
      <stop offset="100%" stop-color="#FFB6C1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5F8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="500" height="400" fill="url(#bgGrad)"/>
  <!-- 装饰圆点 -->
  <circle cx="50" cy="60" r="10" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="450" cy="50" r="14" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="460" cy="350" r="9" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="40" cy="350" r="12" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="250" cy="40" r="6" fill="#FFFFFF" opacity="0.4"/>

  <!-- 主标题 -->
  <text x="250" y="120" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF">我的假期</text>
  <text x="250" y="160" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#FFFFFF" opacity="0.9">假期 &amp; 出差管理小助手 🐰</text>

  <!-- 假期卡片 -->
  <rect x="70" y="200" width="170" height="150" rx="24" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <circle cx="105" cy="240" r="20" fill="#FFE8F0"/>
  <text x="105" y="248" text-anchor="middle" font-size="22">🌴</text>
  <text x="135" y="240" font-family="PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#FF6B9D">年假余额</text>
  <text x="155" y="295" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="48" font-weight="bold" fill="#FF6B9D">5</text>
  <text x="155" y="320" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" fill="#999">剩余天数</text>

  <!-- 出差卡片 -->
  <rect x="260" y="200" width="170" height="150" rx="24" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <circle cx="295" cy="240" r="20" fill="#E8F0FF"/>
  <text x="295" y="248" text-anchor="middle" font-size="22">✈️</text>
  <text x="325" y="240" font-family="PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#5B8FF9">出差统计</text>
  <text x="345" y="295" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="48" font-weight="bold" fill="#5B8FF9">3</text>
  <text x="345" y="320" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" fill="#999">本月天数</text>

  <!-- 底部标语 -->
  <text x="250" y="380" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" fill="#FFFFFF" opacity="0.85">轻松记录，清晰明了</text>
</svg>
